# Copy to config.toml and edit. config.toml is gitignored.

[display]
username = "leblanchannah"     # shown in the SVG <title>
units = "km"                   # "km" or "mi"
timezone = "America/Toronto"   # days are bucketed in this zone
weeks = 53                     # number of columns (GitHub uses 53)

[data]
csv = "daily_km.csv"           # date,km  (written by fetch_garmin.py)
output = "runs.svg"

# Colour scale. Each run day is coloured by (km / max) ** gamma along the ramp,
# so the longest day in the window is always the brightest square.
#   max = 0     -> use your longest day in the last year (default)
#   max = 42.2  -> fix the top of the scale (e.g. marathon distance)
#   gamma < 1 brightens short runs; gamma = 1 is linear.
[scale]
max = 0
gamma = 0.5

# GitHub dark-theme colours with an orange ramp (dim -> bright).
[colors]
background = "#22272e"
border = "#444c56"
text = "#adbac7"
empty = "#2d333b"
ramp = ["#4a1f06", "#a8470f", "#f27a1a", "#ffc58a"]
